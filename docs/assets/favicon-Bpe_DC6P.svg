<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1c1614"/>
      <stop offset="60%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </radialGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f29979"/>
      <stop offset="45%" stop-color="#c86446"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGlow)" stroke="#c86446" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#copperGrad)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6"/>

  <!-- Diamond / Sanctuary Geometric Frame -->
  <polygon points="256,92 400,256 256,420 112,256" fill="none" stroke="url(#copperGrad)" stroke-width="6" stroke-linejoin="round" opacity="0.8" filter="url(#glow)"/>

  <!-- Interlocking "A" & "V" Stylized Crest -->
  <!-- 'A' Structure -->
  <path d="M 256,128 L 340,356 L 302,356 L 284,306 L 228,306 L 210,356 L 172,356 Z M 256,220 L 238,272 L 274,272 Z" fill="url(#copperGrad)"/>

  <!-- 'V' Overlay (Intertwined) -->
  <path d="M 198,188 L 238,188 L 256,336 L 274,188 L 314,188 L 278,384 L 234,384 Z" fill="url(#copperGrad)" opacity="0.95"/>

  <!-- Emerald Eye / Core Jewel (Hypnotic Center) -->
  <circle cx="256" cy="256" r="16" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="6" fill="#ecfdf5"/>
</svg>
